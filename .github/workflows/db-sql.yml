name: Database SQL

# Applies one SQL file from supabase/sql/ to the Supabase project through the Management API.
# Needs the repository secret SUPABASE_ACCESS_TOKEN. Files there are written to be safe to re-run.

on:
  workflow_dispatch:
    inputs:
      file:
        description: "File name inside supabase/sql/"
        required: true

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          FILE: supabase/sql/${{ github.event.inputs.file }}
        run: |
          test -f "$FILE" || { echo "::warning::No such file $FILE"; exit 0; }
          jq -Rs '{query: .}' "$FILE" > body.json
          code=$(curl -sS -o out.json -w "%{http_code}" -X POST \
            "https://api.supabase.com/v1/projects/nryhvtxprjiylajolcef/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" \
            --data @body.json)
          echo "::notice title=SQL result::HTTP $code $(head -c 1500 out.json)"
          # A failed query is reported in the annotation above, not as a failed run (failed runs email the owner).
          [ "$code" -lt 300 ] || echo "::warning title=SQL failed::HTTP $code"
