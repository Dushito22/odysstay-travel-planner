name: Resend check
on:
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    env:
      KEY: ${{ secrets.RESEND_API_KEY }}
    steps:
      - name: Check
        run: |
          # Sends one plain test email and prints Resend's answer (an id, or the reason it refused).
          echo "::notice title=Send::$(curl -sS -X POST https://api.resend.com/emails -H "Authorization: Bearer $KEY" -H 'content-type: application/json' \
            -d '{"from":"Argos at Odysstay <argos@odysstay.xyz>","to":["gyurovik@gmail.com"],"subject":"Odysstay test","text":"Test from Odysstay. If you see this, email works."}' -w ' HTTP %{http_code}')"
