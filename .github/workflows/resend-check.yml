name: Resend check
on:
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    env:
      KEY: ${{ secrets.RESEND_API_KEY }}
    steps:
      - name: Check
        run: |
          # Sends one plain test email and prints Resend's answer (an id, or the reason it refused).
          echo "::notice title=Send::$(curl -sS -X POST https://api.resend.com/emails -H "Authorization: Bearer $KEY" -H 'content-type: application/json' \
            -d '{"from":"Argos at Odysstay <argos@odysstay.xyz>","to":["hello@odysstay.xyz"],"subject":"Test: hello@odysstay.xyz","text":"If this reached your Gmail, receiving works. Reply to it to check replies go back to the sender."}' -w ' HTTP %{http_code}')"
