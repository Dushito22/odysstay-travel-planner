name: Worker

# Collects new public notices, reads them with AI and updates listings in Supabase.
# The comune website crawl is manual only (Run workflow > comuni-crawl): it is slow and low-yield next to court sales.
# Needs repository secrets SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY and ANTHROPIC_API_KEY.
# Without them every job skips itself.

on:
  schedule:
    - cron: "17 5 * * *"   # daily 05:17 UTC: court sales, notary sales, €1 towns, map, scores (no AI)
    - cron: "23 6-22 * * *" # hourly: read the documents of listings someone starred (no AI); exits at once if none
  workflow_dispatch:
    inputs:
      task:
        description: "What to run"
        type: choice
        options: [daily, deep, notary, one-euro, aste, aste-probe, notary-probe, sources-probe, pvp, perizia, rescore, retry-errors, check, pvp-probe, comuni-crawl, comuni-discover, status]
        default: daily
      limit:
        description: "pvp: max lots to read. perizia: max reports to read. deep: listings to read"
        required: false
        default: "25000"

concurrency:
  # Quick tasks and the court-sales load run alongside a long comuni crawl; the rest queues.
  group: ${{ contains(fromJSON('["pvp-probe","sources-probe","notary-probe","aste-probe","check","status","pvp"]'), github.event.inputs.task) && format('quick-{0}', github.run_id) || 'worker' }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    defaults:
      run:
        working-directory: worker
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      WORKER_CONTACT: hello@odysstay.com
    steps:
      - name: Check secrets
        id: secrets
        working-directory: .
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "Worker secrets are not set yet. Skipping."; echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Anything starred to read?
        id: queue
        if: steps.secrets.outputs.ok == 'true' && github.event.schedule == '23 6-22 * * *'
        working-directory: .
        run: |
          N=$(curl -s "$SUPABASE_URL/rest/v1/deep_dives?status=eq.pending&select=listing_id&limit=1" -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" | grep -c listing_id || true)
          echo "Pending deep dives: $N"
          echo "skip=$([ "$N" = "0" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: steps.secrets.outputs.ok == 'true' && steps.queue.outputs.skip != 'true'
      - uses: actions/setup-python@v5
        if: steps.secrets.outputs.ok == 'true' && steps.queue.outputs.skip != 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: worker/requirements.txt
      - name: Restore crawl cache
        if: steps.secrets.outputs.ok == 'true' && steps.queue.outputs.skip != 'true'
        uses: actions/cache@v4
        with:
          path: worker/data
          key: worker-data-${{ github.run_id }}
          restore-keys: worker-data-
      - name: Install
        if: steps.secrets.outputs.ok == 'true' && steps.queue.outputs.skip != 'true'
        run: pip install -r requirements.txt
      - name: Install OCR
        if: steps.secrets.outputs.ok == 'true' && steps.queue.outputs.skip != 'true' && (github.event.inputs.task == 'deep' || github.event.schedule == '23 6-22 * * *')
        run: sudo apt-get update -qq && sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-ita poppler-utils > /dev/null
      - name: Run
        if: steps.secrets.outputs.ok == 'true' && steps.queue.outputs.skip != 'true'
        run: |
          TASK="${{ github.event.inputs.task }}"
          if [ -z "$TASK" ]; then
            if [ "${{ github.event.schedule }}" = "23 6-22 * * *" ]; then TASK=deep; else TASK=daily; fi
          fi
          set -o pipefail
          case "$TASK" in
            daily)           python -m odysstay_worker daily 2>&1 | tee run.log ;;
            deep)            python -m odysstay_worker deep --limit 30 ${{ github.event.inputs.limit && github.event.inputs.limit != '25000' && format('--sample {0}', github.event.inputs.limit) || '' }} 2>&1 | tee run.log ;;
            comuni-crawl)    { python -m odysstay_worker comuni crawl --limit 2500 --workers 12 && python -m odysstay_worker extract --limit 150 && python -m odysstay_worker geocode && python -m odysstay_worker score && python -m odysstay_worker status; } 2>&1 | tee run.log ;;
            comuni-discover) { python -m odysstay_worker comuni discover && python -m odysstay_worker status; } 2>&1 | tee run.log ;;
            status)          python -m odysstay_worker status 2>&1 | tee run.log ;;
            pvp)             { python -m odysstay_worker pvp --limit ${{ github.event.inputs.limit || '25000' }} && python -m odysstay_worker geocode && python -m odysstay_worker score && python -m odysstay_worker costs && python -m odysstay_worker status; } 2>&1 | tee run.log ;;
            perizia)         { python -m odysstay_worker perizia --limit ${{ github.event.inputs.limit || '40' }} && python -m odysstay_worker score && python -m odysstay_worker costs; } 2>&1 | tee run.log ;;
            rescore)         { python -m odysstay_worker score && python -m odysstay_worker costs && python -m odysstay_worker status; } 2>&1 | tee run.log ;;
            one-euro)        { python -m odysstay_worker one-euro && python -m odysstay_worker geocode && python -m odysstay_worker score && python -m odysstay_worker status; } 2>&1 | tee run.log ;;
            aste)            { python -m odysstay_worker aste --limit ${{ github.event.inputs.limit != '25000' && github.event.inputs.limit || '4000' }} && python -m odysstay_worker geocode && python -m odysstay_worker score && python -m odysstay_worker costs && python -m odysstay_worker status; } 2>&1 | tee run.log ;;
            aste-probe)      python -m odysstay_worker aste --probe 2>&1 | tee run.log ;;
            notary-probe)    python -m odysstay_worker notary --probe 2>&1 | tee run.log ;;
            notary)          { python -m odysstay_worker notary && python -m odysstay_worker geocode && python -m odysstay_worker score && python -m odysstay_worker costs && python -m odysstay_worker status; } 2>&1 | tee run.log ;;
            sources-probe)   python -m odysstay_worker sources-probe 2>&1 | tee run.log ;;
            pvp-probe)       python -m odysstay_worker pvp-probe 2>&1 | tee run.log ;;
            check)           python -m odysstay_worker check 2>&1 | tee run.log ;;
            retry-errors)    { python -m odysstay_worker check && python -m odysstay_worker extract --retry-errors --limit 150 && python -m odysstay_worker geocode && python -m odysstay_worker grants && python -m odysstay_worker score && python -m odysstay_worker status; } 2>&1 | tee run.log ;;
          esac
      - name: Summary
        if: always() && steps.secrets.outputs.ok == 'true' && steps.queue.outputs.skip != 'true'
        run: |
          [ -f run.log ] || exit 0
          { echo '```'; tail -n 60 run.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          # One-line annotation so the result is visible from the run page and the API.
          if grep -qi "error" run.log; then echo "::warning title=Worker errors::$(grep -i "error" run.log | grep -v '"errors": 0' | head -n 6 | tr '\n' ' ' | cut -c1-1500)"; fi
          if [ "${{ github.event.inputs.task }}" = "pvp-probe" ] || [ "${{ github.event.inputs.task }}" = "sources-probe" ] || [ "${{ github.event.inputs.task }}" = "notary-probe" ] || [ "${{ github.event.inputs.task }}" = "aste-probe" ]; then i=0; while IFS= read -r line; do i=$((i+1)); [ $i -le 20 ] && echo "::notice title=Probe $i::$(echo "$line" | cut -c1-3500)"; done < run.log; fi
          echo "::notice title=Worker start::$(head -n 12 run.log | tr '\n' ' ' | cut -c1-900)"
          echo "::notice title=Worker ${{ github.event.inputs.task || 'scheduled' }}::$(tail -n 8 run.log | tr '\n' ' ' | cut -c1-900)"
