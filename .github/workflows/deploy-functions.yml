name: Deploy edge functions

# Deploys supabase/functions to the Supabase project whenever they change on main.
# Needs the repository secret SUPABASE_ACCESS_TOKEN (Supabase > Account > Access Tokens).

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"
      - "supabase/config.toml"
      - ".github/workflows/deploy-functions.yml"
  workflow_dispatch:

concurrency:
  group: deploy-functions
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: nryhvtxprjiylajolcef
    steps:
      - name: Check token
        id: token
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::warning::SUPABASE_ACCESS_TOKEN is not set. Add it under Settings > Secrets and variables > Actions, then re-run."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.token.outputs.ok == 'true'
      - uses: supabase/setup-cli@v1
        if: steps.token.outputs.ok == 'true'
        with:
          version: latest
      - name: Deploy
        if: steps.token.outputs.ok == 'true'
        run: |
          for fn in agent-chat draft-message generate-render translate-listing argos; do
            echo "Deploying $fn"
            supabase functions deploy "$fn" --project-ref "$PROJECT_REF" --use-api \
              || supabase functions deploy "$fn" --project-ref "$PROJECT_REF"
          done
      - name: List deployed functions
        if: steps.token.outputs.ok == 'true'
        run: supabase functions list --project-ref "$PROJECT_REF"
