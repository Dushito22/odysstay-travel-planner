name: Function logs

# Read-only: recent errors and logs of the edge functions. Needs SUPABASE_ACCESS_TOKEN.
on:
  workflow_dispatch:
    inputs:
      fn:
        description: "function name filter (e.g. telegram), empty for all"
        required: false
        default: ""
      hours:
        description: "how far back"
        required: false
        default: "6"

jobs:
  logs:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      P: nryhvtxprjiylajolcef
    steps:
      - name: Logs
        run: |
          START=$(date -u -d "-${{ inputs.hours }} hours" +%Y-%m-%dT%H:%M:%SZ)
          END=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          for T in function_logs functions_logs deno_logs edge_logs function_edge_logs; do
            R=$(curl -sS -G "https://api.supabase.com/v1/projects/$P/analytics/endpoints/logs" -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              --data-urlencode "sql=select timestamp, event_message from $T limit 1" --data-urlencode "iso_timestamp_start=$START" --data-urlencode "iso_timestamp_end=$END" | cut -c1-200)
            echo "::notice title=table $T::$R"
          done
          SQL="select timestamp, event_message from function_logs where event_message not like '%booted%' and event_message not like '%shutdown%' order by timestamp desc limit 60"
          curl -sS -G "https://api.supabase.com/v1/projects/$P/analytics/endpoints/logs" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            --data-urlencode "sql=$SQL" --data-urlencode "iso_timestamp_start=$START" --data-urlencode "iso_timestamp_end=$END" > logs.json
          jq -r '.result[]? | "\(.timestamp) \(.event_message | gsub("\\s+"; " ") | .[0:400])"' logs.json | grep -i "${{ inputs.fn }}" | head -60 > out.txt || true
          [ -s out.txt ] || jq -c . logs.json | cut -c1-800 > out.txt
          i=0; while IFS= read -r line; do i=$((i+1)); echo "::notice title=log $i::$line"; done < out.txt
