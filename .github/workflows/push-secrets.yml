name: Push secrets to Supabase

# Copies optional keys from GitHub repository secrets to Supabase Edge Function secrets.
# Add RESEND_API_KEY (and optionally DROP_FROM) in GitHub, then run this once.
on:
  workflow_dispatch:

jobs:
  push:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      DROP_FROM: ${{ secrets.DROP_FROM }}
      TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
      RESEND_FULL_KEY: ${{ secrets.RESEND_FULL_KEY }}
      RESEND_WEBHOOK_SECRET: ${{ secrets.RESEND_WEBHOOK_SECRET }}
      INBOUND_DOMAIN: ${{ secrets.INBOUND_DOMAIN }}
      OFFICE_PHONE: ${{ secrets.OFFICE_PHONE }}
      AGENT_NAME_IT: ${{ secrets.AGENT_NAME_IT }}
      PAY_USDT_ETHEREUM: ${{ secrets.PAY_USDT_ETHEREUM }}
      PAY_USDT_SOLANA: ${{ secrets.PAY_USDT_SOLANA }}
      PAY_USDT_BASE: ${{ secrets.PAY_USDT_BASE }}
      PAY_USDT_POLYGON: ${{ secrets.PAY_USDT_POLYGON }}
      PAY_USDT_ARBITRUM: ${{ secrets.PAY_USDT_ARBITRUM }}
      PAY_USDT_BSC: ${{ secrets.PAY_USDT_BSC }}
      PAY_USDC_ETHEREUM: ${{ secrets.PAY_USDC_ETHEREUM }}
      PAY_USDC_SOLANA: ${{ secrets.PAY_USDC_SOLANA }}
      PAY_USDC_POLYGON: ${{ secrets.PAY_USDC_POLYGON }}
      PAY_USDC_ARBITRUM: ${{ secrets.PAY_USDC_ARBITRUM }}
      PAY_NAME: ${{ secrets.PAY_NAME }}
      PAY_EUR_IBAN: ${{ secrets.PAY_EUR_IBAN }}
      PAY_EUR_BIC: ${{ secrets.PAY_EUR_BIC }}
      PAY_GBP_ACCOUNT: ${{ secrets.PAY_GBP_ACCOUNT }}
      PAY_USD_ACCOUNT: ${{ secrets.PAY_USD_ACCOUNT }}
      PAY_USDT_TRON: ${{ secrets.PAY_USDT_TRON }}
      PAY_USDC_BASE: ${{ secrets.PAY_USDC_BASE }}
    steps:
      - name: Push
        run: |
          BODY=$(jq -nc '[$ENV | to_entries[] | select(.key | test("^(RESEND_API_KEY|RESEND_FULL_KEY|RESEND_WEBHOOK_SECRET|INBOUND_DOMAIN|OFFICE_PHONE|AGENT_NAME_IT|DROP_FROM|TELEGRAM_CHANNEL_ID|PAY_.*)$")) | select(.value != "") | {name: .key, value: .value}]')
          [ "$BODY" = "[]" ] && { echo "::warning::No secrets to push. Add RESEND_API_KEY in GitHub repository secrets."; exit 0; }
          R=$(curl -sS -X POST "https://api.supabase.com/v1/projects/nryhvtxprjiylajolcef/secrets" -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "content-type: application/json" -d "$BODY" -w ' HTTP %{http_code}')
          echo "::notice title=Pushed::$(echo "$BODY" | jq -r '[.[].name] | join(", ")') $R"
