name: Push secrets to Supabase

# Copies optional keys from GitHub repository secrets to Supabase Edge Function secrets.
# Add RESEND_API_KEY (and optionally DROP_FROM) in GitHub, then run this once.
on:
  workflow_dispatch:

jobs:
  push:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      DROP_FROM: ${{ secrets.DROP_FROM }}
    steps:
      - name: Push
        run: |
          BODY=$(jq -nc --arg r "$RESEND_API_KEY" --arg f "$DROP_FROM" '[{name:"RESEND_API_KEY",value:$r},{name:"DROP_FROM",value:$f}] | map(select(.value != ""))')
          [ "$BODY" = "[]" ] && { echo "::warning::No secrets to push. Add RESEND_API_KEY in GitHub repository secrets."; exit 0; }
          R=$(curl -sS -X POST "https://api.supabase.com/v1/projects/nryhvtxprjiylajolcef/secrets" -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "content-type: application/json" -d "$BODY" -w ' HTTP %{http_code}')
          echo "::notice title=Pushed::$(echo "$BODY" | jq -r '[.[].name] | join(", ")') $R"
