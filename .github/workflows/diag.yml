name: Diagnostics

# Reads recent edge function logs through the Management API. Needs SUPABASE_ACCESS_TOKEN.
on:
  workflow_dispatch:
    inputs:
      sql:
        description: "Logs SQL"
        required: false
        default: "select timestamp, event_message from function_logs order by timestamp desc limit 40"

jobs:
  logs:
    runs-on: ubuntu-latest
    steps:
      - name: Logs
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SQL: ${{ github.event.inputs.sql }}
        run: |
          START=$(date -u -d '-2 days' +%Y-%m-%dT%H:%M:%SZ); END=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          curl -sS -G "https://api.supabase.com/v1/projects/nryhvtxprjiylajolcef/analytics/endpoints/logs" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            --data-urlencode "sql=$SQL" --data-urlencode "iso_timestamp_start=$START" --data-urlencode "iso_timestamp_end=$END" > out.json
          i=0; jq -c '.result[]?' out.json | while read -r l; do i=$((i+1)); echo "::notice title=Log $i::$(echo "$l" | cut -c1-900)"; done
          echo "::notice title=Raw::$(head -c 1500 out.json)"
      - name: Function secrets and functions (names only)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          echo "::notice title=Secret names::$(curl -sS https://api.supabase.com/v1/projects/nryhvtxprjiylajolcef/secrets -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" | jq -r '[.[].name] | join(", ")')"
          echo "::notice title=Functions::$(curl -sS https://api.supabase.com/v1/projects/nryhvtxprjiylajolcef/functions -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" | jq -r '[.[] | "\(.slug) v\(.version) \(.status)"] | join(", ")')"
      - name: Smoke test public functions
        run: |
          F=https://nryhvtxprjiylajolcef.supabase.co/functions/v1
          K=sb_publishable_zdY6uxrouCZN2azT4rxUwQ_kZ6H86b5
          echo "::notice title=capture (bad token, expect 401)::$(curl -s -X POST $F/capture -H "apikey: $K" -H 'content-type: application/json' -H 'x-capture-token: wrong-token-wrong-token-1234' -d '{"source":"idealista","listings":[]}' -w ' HTTP %{http_code}')"
          echo "::notice title=argos::$(curl -s -X POST $F/argos -H "apikey: $K" -H 'content-type: application/json' -d '{"messages":[{"role":"user","text":"A house in Puglia under 40k"}],"understood":["up to €40,000","Puglia"],"total":12,"top":[{"comune":"Ceglie Messapica","price_eur":32000,"type":"house"}]}' -w ' HTTP %{http_code}' | cut -c1-600)"
          ID=$(curl -s "https://nryhvtxprjiylajolcef.supabase.co/rest/v1/listing_feed?select=id&has_real_photo=eq.true&order=score.desc&limit=1" -H "apikey: $K" | jq -r '.[0].id')
          echo "::notice title=area-brief $ID::$(curl -s -m 150 -X POST $F/area-brief -H "apikey: $K" -H 'content-type: application/json' -d "{\"listing_id\":\"$ID\",\"lang\":\"en\"}" -w ' HTTP %{http_code} in %{time_total}s' | cut -c1-900)"
          echo "::notice title=argos-voice::$(curl -s -m 60 -o voice.bin -X POST $F/argos-voice -H "apikey: $K" -H 'content-type: application/json' -d '{"text":"Ciao, sono Argos.","lang":"it"}' -w 'HTTP %{http_code} in %{time_total}s') $(wc -c < voice.bin) bytes $(head -c 200 voice.bin | tr -dc '[:print:]' | cut -c1-200)"
      - name: Telegram webhook
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          [ -n "$TOKEN" ] && echo "::notice title=Telegram::$(curl -s https://api.telegram.org/bot$TOKEN/getWebhookInfo | head -c 800)" || echo "::notice title=Telegram::no TELEGRAM_BOT_TOKEN in GitHub secrets"
