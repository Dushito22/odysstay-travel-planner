name: Channel art

# Fetches openly licensed Italian photos from Wikimedia Commons, grades them in the Odysstay look and stores
# them for the Telegram channel (table channel_art). Run by hand. The graded photos are also attached to the run.
on:
  workflow_dispatch:
    inputs:
      per_theme:
        description: "Photos per theme"
        default: "3"

jobs:
  art:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install httpx pillow numpy fonttools brotli
      - name: Fetch and grade
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python worker/channel_art.py "${{ github.event.inputs.per_theme }}"
      - uses: actions/upload-artifact@v4
        with: { name: channel-art, path: out/ }
