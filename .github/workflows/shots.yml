name: Page screenshots

# Takes full-page screenshots of a URL (desktop and phone) and pushes them to the samples-data branch.
# Used to study reference sites and check our published pages. Diagnostic only.
on:
  workflow_dispatch:
    inputs:
      url:
        description: "Page URL"
        required: true

permissions:
  contents: write

jobs:
  shoot:
    runs-on: ubuntu-latest
    steps:
      - name: Screenshots
        env:
          URL: ${{ github.event.inputs.url }}
        run: |
          mkdir shots && cd shots
          npm init -y > /dev/null && npm i -s playwright@1.48.2 > /dev/null && npx playwright install --with-deps chromium > /dev/null 2>&1
          cat > s.js <<'JS'
          const { chromium } = require('playwright');
          (async () => {
            const b = await chromium.launch();
            for (const [n, w, h] of [['desktop', 1440, 900], ['phone', 390, 844]]) {
              const p = await b.newPage({ viewport: { width: w, height: h }, deviceScaleFactor: 1 });
              await p.goto(process.env.URL, { waitUntil: 'networkidle', timeout: 60000 }).catch(() => {});
              await p.waitForTimeout(2500);
              for (let y = 0; y < 20000; y += 700) { await p.mouse.wheel(0, 700); await p.waitForTimeout(150); }
              await p.waitForTimeout(1500);
              await p.screenshot({ path: `${n}.png`, fullPage: true });
            }
            await b.close();
          })();
          JS
          node s.js; rm -rf node_modules package*.json s.js; ls -la
      - name: Push
        run: |
          cd shots
          git init -q && git checkout -q -b samples-data
          git -c user.name=bot -c user.email=bot@users.noreply.github.com add -A
          git -c user.name=bot -c user.email=bot@users.noreply.github.com commit -qm "shots"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" samples-data
