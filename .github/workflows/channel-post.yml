name: Channel post

# Three posts a day on the public Telegram channel, Moscow time, never at night: ~10:00 a find (or the answer to
# last night's price game), ~14:00 something dreamy (story, retro poster, region postcard, word, saying, hand-written
# post), ~19:00 the price game every other day, otherwise another dreamy post. The function decides; this only knocks
# every 30 minutes (GitHub's scheduler drops and delays runs, so it knocks often). Run by hand with dry=true to preview.
on:
  schedule:
    - cron: "7,37 6-19 * * *"
  workflow_dispatch:
    inputs:
      dry:
        description: "Preview only, don't post"
        default: "true"
      kind:
        description: "auto, morning, house, light, guess, word, region, story, poster, queue-eve"
        required: false

jobs:
  post:
    runs-on: ubuntu-latest
    env:
      SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
    steps:
      - name: Post
        run: |
          DRY="${{ github.event.inputs.dry }}"
          KIND="${{ github.event.inputs.kind }}"
          GAP=0
          if [ -z "$KIND" ]; then KIND=auto; fi
          R=$(curl -sS --max-time 120 -X POST https://nryhvtxprjiylajolcef.supabase.co/functions/v1/channel-post \
            -H "content-type: application/json" -H "x-drop-secret: $SECRET" -d "{\"dry\": ${DRY:-false}, \"kind\": \"$KIND\", \"min_gap_hours\": $GAP, \"fix_buttons\": $([ "$KIND" = fix-buttons ] && echo true || echo false)}")
          echo "$R"
          echo "::notice title=Post::$(echo "$R" | head -c 1500)"
