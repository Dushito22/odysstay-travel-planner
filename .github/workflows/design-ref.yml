name: Design reference

# Studies a reference site (styles, type, spacing, effects) and fetches openly licensed Italy photos
# from Wikimedia Commons with their licence data. Pushes results to the samples-data branch. Diagnostic only.
on:
  workflow_dispatch:
    inputs:
      url:
        description: "Reference URL"
        required: true
        default: "https://getbalance.ai/"
      queries:
        description: "Commons searches, separated by |"
        required: false
        default: "Atrani|Matera Sassi|Alberobello trulli|Ostuni|Positano|Cefalù street|Tuscany farmhouse cypress|Puglia masseria|Sicily village alley|Italian village laundry balcony|Civita di Bagnoregio|Procida"

permissions:
  contents: write

jobs:
  study:
    runs-on: ubuntu-latest
    steps:
      - name: Study the reference
        env:
          URL: ${{ github.event.inputs.url }}
        run: |
          mkdir out && cd out
          npm init -y > /dev/null && npm i -s playwright@1.48.2 > /dev/null && npx playwright install --with-deps chromium > /dev/null 2>&1
          cat > s.js <<'JS'
          const { chromium } = require('playwright');
          const fs = require('fs');
          (async () => {
            const b = await chromium.launch();
            const p = await b.newPage({ viewport: { width: 1440, height: 900 }, deviceScaleFactor: 2 });
            const css = [];
            p.on('response', async (r) => { try { const u = r.url(); const ct = r.headers()['content-type'] || '';
              if (ct.includes('css')) css.push(`/* ${u} */\n` + await r.text());
              if (/font|woff/.test(ct) || /\.woff2?/.test(u)) fs.appendFileSync('fonts.txt', u + '\n');
              if (/image/.test(ct)) fs.appendFileSync('images.txt', u + ' ' + ct + '\n'); } catch {} });
            await p.goto(process.env.URL, { waitUntil: 'networkidle', timeout: 60000 }).catch(() => {});
            await p.waitForTimeout(2500);
            for (let y = 0; y < 30000; y += 600) { await p.mouse.wheel(0, 600); await p.waitForTimeout(200); }
            await p.waitForTimeout(2000);
            await p.evaluate(() => window.scrollTo(0, 0)); await p.waitForTimeout(800);
            const H = await p.evaluate(() => document.documentElement.scrollHeight);
            for (let y = 0, i = 0; y < H; y += 900, i++) {
              await p.evaluate((y) => window.scrollTo(0, y), y); await p.waitForTimeout(700);
              await p.screenshot({ path: `view-${String(i).padStart(2, '0')}.png` });
            }
            fs.writeFileSync('styles.css', css.join('\n\n'));
            fs.writeFileSync('page.html', await p.content());
            const dump = await p.evaluate(() => {
              const keys = ['fontFamily','fontSize','fontWeight','fontStyle','lineHeight','letterSpacing','color','backgroundColor','backgroundImage',
                'padding','margin','borderRadius','border','boxShadow','filter','mixBlendMode','opacity','maxWidth','width','height','gap','textTransform','fontFeatureSettings','backdropFilter'];
              const out = [];
              const sel = 'h1,h2,h3,h4,h5,h6,p,a,button,nav,header,footer,section,img,video,input,li,span,label,[class*=grain],[class*=noise],[class*=card],[class*=btn],[class*=button],[class*=pill],[class*=tag],[class*=badge],canvas,svg';
              for (const el of document.querySelectorAll(sel)) {
                const r = el.getBoundingClientRect(); if (r.width < 2 || r.height < 2) continue;
                const cs = getComputedStyle(el); const o = { tag: el.tagName, cls: (el.className && el.className.baseVal !== undefined ? el.className.baseVal : el.className || '').toString().slice(0, 140),
                  text: (el.innerText || el.alt || '').trim().replace(/\s+/g, ' ').slice(0, 90), x: Math.round(r.x), y: Math.round(r.y + scrollY), w: Math.round(r.width), h: Math.round(r.height) };
                for (const k of keys) o[k] = cs[k];
                for (const ps of ['::before','::after']) { const c = getComputedStyle(el, ps); if (c.content && c.content !== 'none' && c.content !== 'normal') o[ps] = { content: c.content, bg: c.backgroundImage.slice(0, 200), op: c.opacity, blend: c.mixBlendMode, pos: c.position, inset: c.inset, filter: c.filter, anim: c.animationName }; }
                out.push(o);
              }
              return out;
            });
            fs.writeFileSync('computed.json', JSON.stringify(dump, null, 1));
            await p.setViewportSize({ width: 390, height: 844 });
            await p.evaluate(() => window.scrollTo(0, 0)); await p.waitForTimeout(1200);
            await p.screenshot({ path: 'phone-full.png', fullPage: true });
            await b.close();
          })();
          JS
          node s.js; rm -rf node_modules package*.json s.js; ls -la
      - name: Commons photos
        env:
          QUERIES: ${{ github.event.inputs.queries }}
        run: |
          cd out && mkdir photos
          python3 - <<'PY'
          import json, os, re, urllib.parse, urllib.request
          UA = {"User-Agent": "OdysstayDesign/1.0 (hello@odysstay.com)"}
          OK = re.compile(r"^(cc0|public domain|pd|cc by(-sa)? ?[234]\.0)", re.I)
          meta = []
          for q in os.environ["QUERIES"].split("|"):
              api = "https://commons.wikimedia.org/w/api.php?" + urllib.parse.urlencode({"action": "query", "format": "json", "generator": "search",
                  "gsrnamespace": 6, "gsrsearch": f"{q} filetype:bitmap", "gsrlimit": 25, "prop": "imageinfo", "iiprop": "url|extmetadata|size", "iiurlwidth": 1800})
              try: pages = json.load(urllib.request.urlopen(urllib.request.Request(api, headers=UA), timeout=40)).get("query", {}).get("pages", {})
              except Exception as e: print(q, e); continue
              got = 0
              for pg in sorted(pages.values(), key=lambda p: p.get("index", 99)):
                  ii = (pg.get("imageinfo") or [{}])[0]; em = ii.get("extmetadata", {})
                  lic = em.get("LicenseShortName", {}).get("value", "")
                  if not OK.match(lic) or ii.get("width", 0) < 1800 or ii.get("width", 0) < ii.get("height", 1): continue
                  name = re.sub(r"[^a-z0-9]+", "-", q.lower()).strip("-") + f"-{got}.jpg"
                  try:
                      data = urllib.request.urlopen(urllib.request.Request(ii["thumburl"], headers=UA), timeout=60).read()
                  except Exception as e: print(e); continue
                  open("photos/" + name, "wb").write(data)
                  meta.append({"file": name, "title": pg["title"], "page": ii.get("descriptionurl"), "license": lic,
                               "artist": re.sub("<[^>]+>", "", em.get("Artist", {}).get("value", "")).strip(), "query": q})
                  got += 1
                  if got >= 5: break
              print(q, got)
          json.dump(meta, open("photos/credits.json", "w"), indent=1)
          PY
          du -sh photos
      - name: Push
        run: |
          cd out
          git init -q && git checkout -q -b samples-data
          git -c user.name=bot -c user.email=bot@users.noreply.github.com add -A
          git -c user.name=bot -c user.email=bot@users.noreply.github.com commit -qm "design reference"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" samples-data
