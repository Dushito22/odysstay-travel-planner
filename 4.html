        *,
        ::after,
        ::before {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0 15px;

            line-height: 1.5;
            text-align: center;
            overflow-x: hidden;
        }

        button,
        input,
        textarea {
            margin: 0;
            font-family: inherit;
            font-size: inherit;
            line-height: inherit;
        }

        textarea {
            overflow: auto;
            resize: vertical;
        }

        header {
            margin: 20vh 0 2rem;
        }

        #turnstile-top {
            margin: 0 auto;
            width: 24rem;
            max-width: 100%;
        }
        #turnstile-bottom {
            margin: 0 auto 2rem;
            width:24rem;
            max-width: 100%;
        }

        .loader {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .loader-dot {
            background-color: #CCCCCC;
            width: 1.25rem;
            height: 1.25rem;
            margin: 0.5rem;
            border-radius: 100%;
            display: inline-block;
            animation: sync 0.6s infinite ease-in-out;
            animation-fill-mode: both;
        }

        .loader-dot-1 {
            animation-delay: calc(0.07s * 1);
        }

        .loader-dot-2 {
            animation-delay: calc(0.07s * 2);
        }

        .loader-dot-3 {
            animation-delay: calc(0.07s * 3);
        }

        @keyframes  sync {
            33% {
                transform: translateY(0.625rem);
            }

            66% {
                transform: translateY(-0.625rem);
            }

            100% {
                transform: translateY(0);
            }
        }

        .support-form {
            display: none;
            margin: 2rem auto;
            text-align: left;
        }

        .support-form.is-open {
            display: block;
        }

        .form-group {
            margin-bottom: 1rem;
        }

        .form-group>label {
            display: inline-block;
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        .form-control {
            display: block;
            width: 100%;
            height: auto;
            padding: 0.5rem 0.75rem;
            font-size: 1rem;
            font-weight: 400;
            line-height: 1.5;
            color: #3a3a3a;
            background-color: #FFFFFF;
            border: 1px solid #CCCCCC;
            border-radius: 0.2rem;
            transition: border-color 0.15s ease-in-out, box-shadow 0.15s ease-in-out;
        }

        .form-control:focus,
        .form-select:focus {
            border-color: #7bb7ff;
            outline: 0;
            box-shadow: 0 0 0 0.2rem rgba(0, 113, 235, 0.25);
        }

        .cta-btn {
            margin-top: 1.5rem;
            display: block;
            width: 100%;
            font-weight: 600;
            color: #FFFFFF;
            text-align: center;
            vertical-align: middle;
            user-select: none;
            background-color: #0071eb;
            border: 1px solid #0071eb;
            border-radius: 0.2rem;
            padding: 0.55rem 3rem;
            font-size: 1.2rem;
            line-height: 1.5;
            text-decoration: none;
            cursor: pointer;
            appearance: button;
            transition: color 0.15s ease-out, background-color 0.15s ease-out, border-color 0.15s ease-out, box-shadow 0.15s ease-out, opacity 0.15s ease-out;
        }

        .cta-btn:hover {
            background-color: #0b5aba;
            border-color: #0b5aba;
            color: #FFFFFF;
            text-decoration: none;
        }

        .cta-btn:disabled {
            background-color: #eee;
            border-color: #ccc;
            color: #6f6f6f;
            cursor: not-allowed;
            opacity: 0.65;
        }

        .support-form-message {
            margin: 0.75rem 0 0;
            font-size: 0.875rem;
        }

        .support-form-message.is-error {
            color: #b32936;
        }

        .support-form-message.is-success {
            color: #1a8735;
        }
    </style>

        (function() {
            const toggle = document.getElementById('support-toggle');
            const form = document.getElementById('support-form');
            const emailInput = document.getElementById('support-sender');
            const textarea = document.getElementById('support-message');
            const submitButton = document.getElementById('support-submit');
            const feedback = document.getElementById('support-form-message');
            const identify = document.getElementById('support-identify');

            const i18n = {
                submit: "Invia",
                sender: "turnstile.form_sender",
                success: "Grazie, il tuo messaggio \u00e8 stato inviato.",
                error: "Si \u00e8 verificato un errore. Riprova pi\u00f9 tardi."            };

            toggle.addEventListener('click', function(event) {
                event.preventDefault();
                form.classList.toggle('is-open');

                if (form.classList.contains('is-open')) {
                    textarea.focus();
                }
            });

            form.addEventListener('submit', function(event) {
                event.preventDefault();

                const message = textarea.value.trim();
                const email = emailInput.value.trim();
                const hp = identify.value.trim();

                if (!message) return;
                if (!email) return;
                //if (hp) return;

                submitButton.disabled = true;
                submitButton.textContent = i18n.sending;
                feedback.textContent = '';
                feedback.className = 'support-form-message';

                fetch('https://www.gate-away.com/turnstile/contact-support', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json',
                        'X-CSRF-TOKEN': document.querySelector('meta[name="csrf-token"]').content
                    },
                    body: JSON.stringify({ email, message, hp })
                })
                .then(function(response) {
                    if (!response.ok) {
                        throw new Error('request failed');
                    }

                    return response.json();
                })
                .then(function() {
                    feedback.textContent = i18n.success;
                    feedback.className = 'support-form-message is-success';
                    textarea.value = '';
                })
                .catch(function() {
                    feedback.textContent = i18n.error;
                    feedback.className = 'support-form-message is-error';
                })
                .finally(function() {
                    submitButton.disabled = false;
                    submitButton.textContent = i18n.submit;
                });
            });
        })();

        function onTurnstileLoad() {
            renderState('loading');

            const validateUrl = "https://www.gate-away.com/validate";
            const csrfToken = document.querySelector('meta[name="csrf-token"]').getAttribute('content');

            turnstile.render('#turnstile-container', {
                sitekey: "0x4AAAAAADyqHn821tL2CcwJ",

                theme: 'light',

                size: 'normal',

                callback: function(token) {
                    fetch(validateUrl, {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                                'X-CSRF-TOKEN': csrfToken,
                                'Accept': 'application/json'
                            },
                            credentials: 'same-origin',
                            body: JSON.stringify({ token })
                        })
                        .then(res => {
                            window.location.reload();
                        })
                        .catch((err) => {
                            console.error('Errore:', err);
                            window.location.reload();
                        })
                },

                'before-interactive-callback': function() {
                    renderState('before-interaction');
                },

                'error-callback': function(err) {
                    fetch(validateUrl, {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                                'X-CSRF-TOKEN': csrfToken,
                                'Accept': 'application/json'
                            },
                            credentials: 'same-origin',
                            body: JSON.stringify({
                                failed: true,
                                error_code: err
                            })
                        })
                        .then(() => {
                            turnstile.remove();
                            renderState('error');
                        })
                        .catch((err) => {
                            console.error('Errore:', err);
                            window.location.reload();
                        })
                },

                'timeout-callback': function() {
                    window.location.reload();
                },

                retry: 'never',

                appearance: 'interaction-only',

                language: document.documentElement.lang ?? 'auto'
            });
        }
