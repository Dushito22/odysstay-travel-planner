<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Offline | Odysstay</title>
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f9fafb;color:#0d1014;font:16px/1.5 system-ui,-apple-system,sans-serif;padding:24px;text-align:center}
  h1{font-size:28px;margin:0 0 8px}
  p{color:#5b6472;margin:0 0 20px;max-width:28rem}
  button{border:0;border-radius:999px;background:#0d1014;color:#f9fafb;padding:10px 20px;font:inherit;cursor:pointer}
  .dot{display:inline-block;width:.28em;height:.28em;border-radius:50%;background:#006da6;margin-left:2px}
</style>
</head>
<body>
<main>
  <h1>Odysstay<span class="dot"></span></h1>
  <p>You're offline. Your deals and messages will be here as soon as you're back online.</p>
  <button onclick="location.reload()">Try again</button>
</main>
</body>
</html>
