<!doctype html>
<html><head><meta charset="utf-8"><style>
  body { font: 13px -apple-system, system-ui, sans-serif; width: 280px; margin: 14px; color: #141414; }
  h1 { font-size: 15px; margin: 0 0 4px; font-weight: 600; }
  p { margin: 6px 0; color: #555; line-height: 1.35; }
  input { width: 100%; box-sizing: border-box; padding: 7px 9px; border: 1px solid #ccc; border-radius: 8px; font: 12px ui-monospace, monospace; }
  button { margin-top: 8px; width: 100%; padding: 8px; border: 0; border-radius: 999px; background: #1f6fb2; color: #fff; font-size: 13px; cursor: pointer; }
  button.ghost { background: #eee; color: #141414; }
  #status { margin-top: 10px; padding: 8px 10px; background: #f3f6f9; border-radius: 8px; }
</style></head><body>
  <h1>Odysstay feeder</h1>
  <p>Once a day, while Chrome is open, it reads new Immobiliare.it ads and sends them to Odysstay.</p>
  <div id="keybox">
    <input id="key" placeholder="Paste the key from odysstay.xyz/admin">
    <button id="save">Save key</button>
  </div>
  <button id="run" class="ghost">Run now</button>
  <div id="status">Not run yet.</div>
  <script src="popup.js"></script>
</body></html>
